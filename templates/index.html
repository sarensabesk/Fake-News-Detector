<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fake News Detector</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto}
    textarea{width:100%;min-height:180px;padding:12px;font-size:16px}
    button{padding:10px 16px;font-size:16px;cursor:pointer}
    #result{margin-top:16px;font-weight:700}
  </style>
</head>
<body>
  <h1>Fake News Detector</h1>
  <form id="form">
    <textarea name="text" placeholder="Paste an article…"></textarea><br><br>
    <button type="submit">Analyze</button>
  </form>
  <div id="result"></div>
  <script>
    const form = document.getElementById('form');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.textContent = 'Analyzing…';
      const res = await fetch('/predict', { method: 'POST', body: new FormData(form) });
      const data = await res.json();
      result.textContent = 'Prediction: ' + data.label;
    });
  </script>
</body>
</html>
